name: Update GitHub Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 12:00 AM UTC
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r cache/requirements.txt

      - name: Run script to update SVGs
        env:
          USER_NAME: 'VIDIT45AGARWAL'
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          python today.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update profile statistics" && git push)
